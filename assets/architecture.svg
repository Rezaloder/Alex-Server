<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Alex Server architecture" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#047857"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#b45309"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1000" height="440" rx="16" fill="#f6f7f9"/>

  <text x="100" y="38" text-anchor="middle" font-weight="700" font-size="15" fill="#1b1f24">Users</text>
  <rect x="15" y="60" width="170" height="70" rx="10" fill="#d5f2e7" stroke="#047857"/>
  <text x="100" y="90" text-anchor="middle" font-weight="700" font-size="14" fill="#1b1f24">VLESS + Reality</text>
  <text x="100" y="112" text-anchor="middle" font-size="12" fill="#5d6672">v2rayNG · Hiddify · v2rayN</text>
  <rect x="15" y="165" width="170" height="70" rx="10" fill="#fbead3" stroke="#b45309"/>
  <text x="100" y="195" text-anchor="middle" font-weight="700" font-size="14" fill="#1b1f24">L2TP/IPsec</text>
  <text x="100" y="217" text-anchor="middle" font-size="12" fill="#5d6672">Windows · iOS · macOS</text>
  <rect x="15" y="270" width="170" height="70" rx="10" fill="#dbe7fd" stroke="#2563eb"/>
  <text x="100" y="300" text-anchor="middle" font-weight="700" font-size="14" fill="#1b1f24">WireGuard</text>
  <text x="100" y="322" text-anchor="middle" font-size="12" fill="#5d6672">all platforms · routers</text>

  <rect x="250" y="20" width="430" height="400" rx="16" fill="#ffffff" stroke="#d9dde3" stroke-width="1.5"/>
  <text x="465" y="46" text-anchor="middle" font-weight="700" font-size="15" fill="#1b1f24">Alex Server (Ubuntu 24.04)</text>
  <rect x="270" y="65" width="180" height="80" rx="9" fill="#d5f2e7" stroke="#047857"/>
  <text x="360" y="90" text-anchor="middle" font-weight="700" font-size="13" fill="#1b1f24">3x-ui + Xray (pinned)</text>
  <text x="360" y="110" text-anchor="middle" font-size="11.5" fill="#5d6672">TCP 443 · per-user quota</text>
  <text x="360" y="128" text-anchor="middle" font-size="11.5" fill="#5d6672">mark 0x200</text>
  <rect x="270" y="170" width="180" height="80" rx="9" fill="#fbead3" stroke="#b45309"/>
  <text x="360" y="195" text-anchor="middle" font-weight="700" font-size="13" fill="#1b1f24">strongSwan + xl2tpd</text>
  <text x="360" y="215" text-anchor="middle" font-size="11.5" fill="#5d6672">UDP 500 / 4500 / 1701</text>
  <text x="360" y="233" text-anchor="middle" font-size="11.5" fill="#5d6672">10.203.62.0/24</text>
  <rect x="270" y="275" width="180" height="70" rx="9" fill="#dbe7fd" stroke="#2563eb"/>
  <text x="360" y="300" text-anchor="middle" font-weight="700" font-size="13" fill="#1b1f24">wg-clients</text>
  <text x="360" y="320" text-anchor="middle" font-size="11.5" fill="#5d6672">UDP 51820 · 10.203.61.0/24</text>

  <rect x="480" y="65" width="180" height="280" rx="9" fill="#ebe2fd" stroke="#7c3aed"/>
  <text x="570" y="92" text-anchor="middle" font-weight="700" font-size="13" fill="#1b1f24">Policy routing</text>
  <text x="570" y="116" text-anchor="middle" font-size="11.5" fill="#5d6672">fwmark 0x200 → table 200</text>
  <text x="570" y="136" text-anchor="middle" font-size="11.5" fill="#5d6672">from user subnets → table 200</text>
  <line x1="495" y1="152" x2="645" y2="152" stroke="#d9dde3"/>
  <text x="570" y="176" text-anchor="middle" font-weight="700" font-size="13" fill="#1b1f24">table 200</text>
  <text x="570" y="196" text-anchor="middle" font-size="11.5" fill="#5d6672">default dev wg-out</text>
  <text x="570" y="216" text-anchor="middle" font-size="11.5" fill="#5d6672">fallback: blackhole</text>
  <line x1="495" y1="232" x2="645" y2="232" stroke="#d9dde3"/>
  <text x="570" y="256" text-anchor="middle" font-weight="700" font-size="13" fill="#1b1f24">wg-out</text>
  <text x="570" y="276" text-anchor="middle" font-size="11.5" fill="#5d6672">WireGuard · Table = off</text>
  <text x="570" y="296" text-anchor="middle" font-size="11.5" fill="#5d6672">masquerade only here</text>

  <rect x="270" y="360" width="390" height="48" rx="9" fill="#fbe0e0" stroke="#c62828" stroke-dasharray="5 4"/>
  <text x="465" y="381" text-anchor="middle" font-weight="700" font-size="12.5" fill="#1b1f24">Fail-closed</text>
  <text x="465" y="399" text-anchor="middle" font-size="11.5" fill="#5d6672">FORWARD drop · mark≠wg-out drop · IPv6 drop · blackhole</text>

  <rect x="735" y="150" width="120" height="110" rx="12" fill="#ebe2fd" stroke="#7c3aed"/>
  <text x="795" y="185" text-anchor="middle" font-weight="700" font-size="14" fill="#1b1f24">Egress</text>
  <text x="795" y="207" text-anchor="middle" font-size="11.5" fill="#5d6672">MikroTik /</text>
  <text x="795" y="224" text-anchor="middle" font-size="11.5" fill="#5d6672">foreign server</text>
  <text x="795" y="242" text-anchor="middle" font-size="11.5" fill="#5d6672">(+ Windscribe)</text>
  <rect x="885" y="170" width="100" height="70" rx="12" fill="#ffffff" stroke="#1b1f24"/>
  <text x="935" y="210" text-anchor="middle" font-weight="700" font-size="14" fill="#1b1f24">Internet</text>

  <line x1="185" y1="95" x2="266" y2="105" stroke="#047857" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="185" y1="200" x2="266" y2="210" stroke="#b45309" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="185" y1="305" x2="266" y2="310" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a3)"/>
  <line x1="450" y1="105" x2="476" y2="105" stroke="#047857" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="450" y1="210" x2="476" y2="210" stroke="#b45309" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="450" y1="310" x2="476" y2="310" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a3)"/>
  <line x1="660" y1="205" x2="731" y2="205" stroke="#7c3aed" stroke-width="3" marker-end="url(#a4)"/>
  <text x="696" y="195" text-anchor="middle" font-size="11" fill="#5d6672">WireGuard</text>
  <line x1="855" y1="205" x2="881" y2="205" stroke="#7c3aed" stroke-width="3" marker-end="url(#a4)"/>
</svg>
